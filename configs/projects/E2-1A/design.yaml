# ===== E2-1A baseline engine (DESIGN mode, regen circuit 1) =====
engine: "E2-1A"
description: "Hopper E2 - Initial regenerative engine analysis"
propellants: prop_n2o_ethanol.yaml
chamber: chamber_E2_TC_01.yaml
cooling: cooling_none.yaml

combustion:
  backend: "rocketcea"

operating_point:
  thrust_N: 2200
  pc_bar: 25.0
  of_ratio: 4.0
  eta_cstar: 0.93
  eta_cstar_tol: 0.03
  eta_cf: 0.97
  p_amb_bar: 1.01325

offdesign:
  ox_throttle:
    ox_fraction: [0.4, 1.1]
    n: 27
  of_sweep:
    of_range: [1.5, 6.0]
    n: 36
  envelope:
    throttle_fraction: [0.4, 1.1]
    of_range: [1.5, 6.0]
    n: [22, 22]

regen:
  meta:
    name: E2-1A_regen
    description: Circuit 1
    version: "0.1"
  contour:
    type: from_engine
  sync:
    contour: true
    hot_gas_pc_bar: true
    hot_gas_tc_K: true
    hot_gas_gamma: true
    hot_gas_mol_mass_kg_kmol: true
    hot_gas_c_star_m_s: true
    hot_gas_bartz_correction: true
    of_ratio: true
    mdot: true
  channels:
    count: 50
    start_x: null
    stop_x: null
    inner_wall_thickness: 0.0005
    height: 0.0005
    rib:
      mode: fixed_width
      width: 0.0005
    helix:
      profile: 0
      interp: pchip
      handedness: right
    min_channel_width: 0.0008
  geometry:
    n_stations: 100
    width_reference: mid_height
  solver:
    enabled: true
    coolant: N2O
    coolant_side: oxidizer
    mdot_from_engine: true
    inlet:
      pressure_bar: 80
      temperature_K: 285
      location: nozzle_end
    wall:
      material: IN718
      max_wall_temp_K: 1200
    curvature_enhancement: false
  export:
    stl: false
    step: false
