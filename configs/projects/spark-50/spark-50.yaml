engine: SPARK-50
description: 50N hydrogen GOX thruster for vacuum applications
propellants:
  name: H2/GOX
  oxidizer: Oxygen
  fuel: Hydrogen
  ox_temp_K: 250            # GOX from the bottle / regulator
  fuel_temp_K: 400          # initial guess; replaced by the regen outlet (fuel_temp_source)
  ox_phase: gas
  fuel_phase: gas
  fuel_temp_source: regen_outlet   # GH2 enters the injector at the regen outlet temperature
  cea_oxidizer: O2
  cea_fuel: H2
chamber:
  contraction_ratio: 15
  l_star_m: 0.8
  contour: rao_bell
  bell_fraction: 0.8
  conv_half_angle_deg: 35
  n_stations: 80
  # No H2/O2 calibration exists for this thruster class yet: run raw Bartz with
  # CEA frozen transport and carry the +/- band through the wall-temperature
  # margin (the former 0.6 was inherited from N2O/ethanol anchoring).
  bartz_correction: 1.0
  bartz_correction_tol: 0.3
cooling:
  # fit-check block only; matches the regen layout at the throat
  coolant: Hydrogen
  n_channels: 14
  channel_width_m: 0.0011
  channel_height_m: 0.0008
  rib_width_m: 0.0007
  inner_wall_thickness_m: 0.0005
  wall_material: IN718
  inlet_T_K: 250
  inlet_p_bar: 15
  correlation: gnielinski
combustion:
  backend: rocketcea
  # 7 bar H2/O2 at eps 80: recombination freezes early -> frozen composition
  # is the conservative bound (frozen_at_throat is the optimistic alternative)
  nozzle_flow: frozen
  use_delivery_temperatures: true
operating_point:
  thrust_N: 50
  pc_bar: 7
  of_ratio: 4.2
  eps: 80
  eta_cstar: 0.95
  eta_cf: 0.98
  eta_cf_source: estimate   # divergence x boundary-layer estimate (throat Re ~ 2.5e4)
  p_amb_bar: 0
  pe_bar: null
  eta_cstar_tol: 0.02
analyze_point: null
geometry: null
offdesign:
  ox_throttle: null
  of_sweep:
    of_range:
    - 2
    - 8
    n: 15
regen:
  meta:
    name: SPARK-50_regen
    description: ''
    version: '0.1'
  contour:
    type: from_engine
  sync:
    contour: true
    hot_gas_pc_bar: true
    hot_gas_tc_K: true
    hot_gas_gamma: true
    hot_gas_mol_mass_kg_kmol: true
    hot_gas_c_star_m_s: true
    hot_gas_bartz_correction: true
    hot_gas_transport: true
    hot_gas_throat_curvature: true
    of_ratio: true
    mdot: true
  channels:
    count: 14
    inner_wall_thickness: 0.0005
    height: 0.0008
    rib:
      mode: fixed_width
      width: 0.0007
    helix:
      profile: 0
      interp: pchip
      handedness: right
    min_channel_width: 0.0008
    # stop_x: 0.02   # example: end the jacket at ~eps 20 and radiate the rest
  geometry:
    n_stations: 300
    width_reference: mid_height
  solver:
    enabled: true
    coolant: Hydrogen
    coolant_side: fuel          # the hydrogen fuel flow (2.2 g/s), not the GOX flow
    coolant_correlation: taylor # NASA gaseous-hydrogen correlation
    mdot_from_engine: true
    inlet:
      pressure_bar: 15
      temperature_K: 250
      location: nozzle_end
    hot_gas:
      property_basis: frozen
    wall:
      material: Inconel 718     # limit and k(T), yield(T) from the material database
    skirt:
      enabled: true
      emissivity: 0.8
      T_env_K: 300
      material: C-103
  export:
    stl: true
    step: true
