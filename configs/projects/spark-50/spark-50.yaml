engine: SPARK-50
description: 50N hydrogen GOX thruster for vacuum applications
propellants:
  name: H2/GOX
  oxidizer: Oxygen
  fuel: Hydrogen
  ox_temp_K: 250            # GOX from the bottle / regulator
  fuel_temp_K: 400          # initial guess; replaced by the regen outlet (fuel_temp_source)
  ox_phase: gas
  fuel_phase: gas
  fuel_temp_source: regen_outlet   # GH2 enters the injector at the regen outlet temperature
  cea_oxidizer: O2
  cea_fuel: H2
chamber:
  contraction_ratio: 15
  l_star_m: 0.8
  contour: rao_bell
  bell_fraction: 0.8
  conv_half_angle_deg: 35
  n_stations: 80
  # No H2/O2 calibration exists for this thruster class yet: run raw Bartz with
  # CEA frozen transport and carry the +/- band through the wall-temperature
  # margin (the former 0.6 was inherited from N2O/ethanol anchoring).
  bartz_correction: 1.0
  bartz_correction_tol: 0.3
cooling:
  # fit-check block only; matches the regen layout at the throat (floor width)
  coolant: Hydrogen
  n_channels: 26
  channel_width_m: 0.00064
  channel_height_m: 0.0003
  rib_width_m: 0.0004
  inner_wall_thickness_m: 0.0005
  wall_material: GRCop-42
  inlet_T_K: 250
  inlet_p_bar: 25
  correlation: gnielinski
combustion:
  backend: rocketcea
  # 6 bar H2/O2 at eps 80: recombination freezes early -> frozen composition
  # is the conservative bound (frozen_at_throat is the optimistic alternative)
  nozzle_flow: frozen
  use_delivery_temperatures: true
operating_point:
  thrust_N: 50
  # Cooling redesign: fuel-rich O/F 2.5 and 6 bar. Under frozen expansion the
  # rich mixture costs no Isp (457 s vs 437 s at O/F 4.2), lowers Tc by 600 K
  # and gives 42 % more hydrogen to cool with; 6 bar cuts the throat heat
  # flux by ~12 % against a 9 % larger throat.
  pc_bar: 6
  of_ratio: 2.5
  eps: 80
  eta_cstar: 0.95
  eta_cf: 0.98
  eta_cf_source: estimate   # divergence x boundary-layer estimate (throat Re ~ 2.4e4)
  p_amb_bar: 0
  pe_bar: null
  eta_cstar_tol: 0.02
analyze_point: null
geometry: null
offdesign:
  ox_throttle: null
  of_sweep:
    of_range:
    - 2
    - 8
    n: 15
regen:
  meta:
    name: SPARK-50_regen
    description: >
      GRCop-42 liner, 26 channels, 0.3 mm high through the throat with 0.4 mm
      ribs; shallow wide-rib channels in the chamber; GH2 counterflow from
      eps 40 at 25 bar; C-103 radiation-cooled skirt from eps 40 to 80.
    version: '0.2'
  contour:
    type: from_engine
  sync:
    contour: true
    hot_gas_pc_bar: true
    hot_gas_tc_K: true
    hot_gas_gamma: true
    hot_gas_mol_mass_kg_kmol: true
    hot_gas_c_star_m_s: true
    hot_gas_bartz_correction: true
    hot_gas_transport: true
    hot_gas_throat_curvature: true
    of_ratio: true
    mdot: true
  channels:
    count: 26
    inner_wall_thickness: 0.0005
    # RESA frame: throat at x = 0, injector face at about -64 mm, jacket end at
    # eps 40 (x ~ +43 mm). Throat channels 0.3 mm high for coolant velocity;
    # chamber channels 0.45 mm high so the warm coolant at the injector end
    # still runs fast; opening up toward the jacket end where the flux is low.
    height:
      - [-0.070, 0.00045]
      - [-0.022, 0.00045]
      - [-0.008, 0.0003]
      - [0.000, 0.0003]
      - [0.006, 0.0003]
      - [0.020, 0.00065]
      - [0.044, 0.0010]
    rib:
      # variable rib: 0.4 mm at the throat (26 channels x 0.65 mm), widening
      # in the chamber and nozzle to keep the closeout span near 2 mm
      mode: variable
      width:
        - [-0.070, 0.0016]
        - [-0.025, 0.0016]
        - [-0.010, 0.0004]
        - [0.000, 0.0004]
        - [0.010, 0.0004]
        - [0.025, 0.0010]
        - [0.044, 0.0016]
    helix:
      profile: 0
      interp: pchip
      handedness: right
    min_channel_width: 0.0006
    stop_x: 0.0434            # eps 40; radiation-cooled C-103 skirt beyond
  geometry:
    n_stations: 300
    width_reference: mid_height
  solver:
    enabled: true
    coolant: Hydrogen
    coolant_side: fuel          # the hydrogen fuel flow (3.2 g/s), not the GOX flow
    coolant_correlation: taylor # NASA gaseous-hydrogen correlation
    mdot_from_engine: true
    inlet:
      pressure_bar: 25          # feed margin ~16 bar over pc x 1.2; keeps coolant Mach < 0.3
      temperature_K: 250
      location: nozzle_end
    hot_gas:
      property_basis: frozen
    wall:
      material: GRCop-42        # 1000 K limit, k(T) and yield(T) from the material database
    skirt:
      enabled: true
      emissivity: 0.8
      T_env_K: 300
      material: C-103
  export:
    stl: true
    step: true
